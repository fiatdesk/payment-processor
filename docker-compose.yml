services:
  mongodb:
    image: mongo:7
    container_name: fiatdesk-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=fiatdesk
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      fiatdesk-network:
        aliases:
          - mongo

  # MongoDB admin UI (local development only — not included in production deployments)
  mongo-express:
    image: mongo-express:latest
    container_name: fiatdesk-mongo-express
    restart: unless-stopped
    ports:
      - '8082:8081'
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/?directConnection=true
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_BASICAUTH_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_BASICAUTH_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fiatdesk-network

  # FiatDesk API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fiatdesk-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '${API_PORT:-3333}:${API_PORT:-3333}'
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/fiatdesk?directConnection=true}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      - CHECKOUT_URL=${CHECKOUT_URL:-}
      - PAYMENT_LINK_URL=${PAYMENT_LINK_URL:-}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-80}
      - APP_SECRET=${APP_SECRET:-}
      - SINGLE_TENANT=${SINGLE_TENANT:-true}
      - OPERATOR_API_KEY=${OPERATOR_API_KEY:-}
      - ETH_RPC_URL=${ETH_RPC_URL:-}
      - ETH_CONFIRMATIONS=${ETH_CONFIRMATIONS:-}
      - PAYOUT_BUILD_DEADLINE_SECONDS=${PAYOUT_BUILD_DEADLINE_SECONDS:-}
      - CHECKOUT_RELAYER_KEY=${CHECKOUT_RELAYER_KEY:-}
      - SUBSCRIPTION_OPERATOR_KEY=${SUBSCRIPTION_OPERATOR_KEY:-}
      - LIVEMODE=${LIVEMODE:-false}
      - SETTLEMENT_RAIL=${SETTLEMENT_RAIL:-}
      - ETH_CHAIN_ID=${ETH_CHAIN_ID:-}
      - USDC_ADDRESS=${USDC_ADDRESS:-}
      - PAYOUT_BATCH_ADDRESS=${PAYOUT_BATCH_ADDRESS:-}
      - SUBSCRIPTIONS_ADDRESS=${SUBSCRIPTIONS_ADDRESS:-}
      - SANCTIONS_ORACLE_ADDRESS=${SANCTIONS_ORACLE_ADDRESS:-}
      - CHECKOUT_CONFIRM_TIMEOUT_MS=${CHECKOUT_CONFIRM_TIMEOUT_MS:-}
      - TOPUP_MONITOR_ENABLED=${TOPUP_MONITOR_ENABLED:-}
      - TOPUP_POLL_INTERVAL_MS=${TOPUP_POLL_INTERVAL_MS:-}
      - BILLING_MONITOR_ENABLED=${BILLING_MONITOR_ENABLED:-}
      - BILLING_POLL_INTERVAL_MS=${BILLING_POLL_INTERVAL_MS:-}
      - API_PORT=${API_PORT:-3333}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fiatdesk-network

  # FiatDesk Dashboard (Angular + nginx)
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: fiatdesk-web
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-80}:80'
    environment:
      - API_PORT=${API_PORT:-3333}
    depends_on:
      - api
    networks:
      - fiatdesk-network

volumes:
  mongodb_data:
    driver: local

networks:
  fiatdesk-network:
    driver: bridge

<app-metadata-edit-modal
  [isOpen]="actions.metadataDialogOpen()"
  [loading]="actions.metadataSaving()"
  title="Edit metadata"
  [metadata]="actions.metadataDraft()"
  (formChange)="actions.OnMetadataChange($event)"
  (confirmed)="actions.ConfirmEditMetadata()"
  (cancelled)="actions.metadataDialogOpen.set(false)"
></app-metadata-edit-modal>

<app-confirm-dialog
  [isOpen]="actions.exportDialogOpen()"
  [title]="'Export ' + actions.exportTabLabel()"
  [description]="'Export these ' + actions.exportTabLabel() + ' to a CSV file.'"
  confirmLabel="Export"
  [loading]="actions.exporting()"
  [error]="actions.exportError()"
  (confirmed)="actions.ConfirmExport()"
  (cancelled)="actions.CloseExport()"
></app-confirm-dialog>
